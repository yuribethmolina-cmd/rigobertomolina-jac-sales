    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {"@type":"Question","name":"¿Cómo funciona la compra directa de un vehículo JAC?","acceptedAnswer":{"@type":"Answer","text":"La compra directa consiste en 7 pagos iguales: una afiliación inicial, 5 cuotas mensuales consecutivas y un pago previo a la entrega. No requiere financiamiento bancario ni historial crediticio."}},
        {"@type":"Question","name":"¿Qué diferencia hay entre Compra Directa y Pago Fácil?","acceptedAnswer":{"@type":"Answer","text":"En Compra Directa haces 7 pagos iguales (afiliación + 5 cuotas + previo a entrega). En Pago Fácil haces 12 pagos: una afiliación, 10 cuotas mensuales más pequeñas y una última cuota mayor previo a la entrega. Pago Fácil te permite cuotas más accesibles mes a mes."}},
        {"@type":"Question","name":"¿Los precios incluyen IVA y otros impuestos?","acceptedAnswer":{"@type":"Answer","text":"Los montos publicados son referenciales y están sujetos a variación por flete, seguro, IVA, IGTF y gastos de nacionalización. Contáctame para recibir el cronograma actualizado con el monto exacto."}},
        {"@type":"Question","name":"¿Qué garantía tienen los vehículos JAC?","acceptedAnswer":{"@type":"Answer","text":"Todos los vehículos JAC nuevos incluyen garantía de fábrica. La cobertura y duración varían según el modelo. Escríbeme para conocer los detalles específicos de garantía del modelo que te interesa."}},
        {"@type":"Question","name":"¿Cuánto tarda el proceso desde el primer pago hasta la entrega?","acceptedAnswer":{"@type":"Answer","text":"En Compra Directa el proceso dura aproximadamente 6-7 meses (5 cuotas mensuales + trámites). En Pago Fácil puede extenderse a 11-12 meses. Los tiempos pueden variar según disponibilidad y logística."}},
        {"@type":"Question","name":"¿Cómo es el proceso de nacionalización del vehículo?","acceptedAnswer":{"@type":"Answer","text":"La nacionalización incluye los trámites aduaneros, pago de aranceles e impuestos de importación, y la obtención de la documentación legal para circular en Venezuela. Bel JAC se encarga de gestionar todo el proceso."}},
        {"@type":"Question","name":"¿Puedo elegir el color de mi vehículo?","acceptedAnswer":{"@type":"Answer","text":"Sí, la disponibilidad de colores depende del modelo y del stock vigente. Al momento de tu afiliación puedes indicar tu preferencia de color y te confirmaremos la disponibilidad."}},
        {"@type":"Question","name":"¿Dónde puedo retirar mi vehículo?","acceptedAnswer":{"@type":"Answer","text":"La entrega se coordina directamente contigo. Los puntos de entrega dependen de la logística vigente. Contáctame para conocer las opciones de entrega disponibles para tu zona."}},
        {"@type":"Question","name":"¿Qué necesito para solicitar el Crédito Bel?","acceptedAnswer":{"@type":"Answer","text":"Para aplicar al crédito necesitas: cédula vigente, RIF, recibo de servicio público, balance personal firmado por contador, referencia bancaria, últimos 3 estados de cuenta, 2 referencias personales y constancia de trabajo o certificación de ingresos."}}
      ]
    }
